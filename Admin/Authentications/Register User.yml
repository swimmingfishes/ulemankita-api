info:
  name: Register User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/admin/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{$randomEmail}}",
        "phone": "{{$randomPhoneNumber}}",
        "name": "{{$randomFullName}}",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
